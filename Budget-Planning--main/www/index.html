<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JehuLie Budget Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>JehuLie Budget Planner</h1>
  </header>

  <!-- Admin Login Section -->
  <section id="login-section" class="login-container">
    <h2>Admin Login</h2>
    <form id="login-form">
      <label for="admin-username">Username</label>
      <input type="text" id="admin-username" required placeholder="Enter username" />

      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" required placeholder="Enter password" />

      <button type="submit">Login</button>
    </form>
  </section>

  <!-- Protected Main Content (Hidden by default) -->
  <main id="main-content" style="display: none;">
    <!-- Month & Year Filter -->
    <section class="filter-section">
      <label for="month">Month:</label>
      <select id="month"></select>

      <label for="year">Year:</label>
      <select id="year"></select>

      <button id="filter-btn">Filter</button>
      <button id="logout-btn">Logout</button> <!-- Logout button -->
    </section>

    <!-- Budget Summary -->
    <section class="summary">
      <div class="summary-box">
        <h3>Total Income</h3>
        <p id="total-income">₱0.00</p>
      </div>
      <div class="summary-box">
        <h3>Total Expenses</h3>
        <p id="total-expense">₱0.00</p>
      </div>
      <div class="summary-box">
        <h3>Net Balance</h3>
        <p id="net-balance">₱0.00</p>
      </div>
    </section>

    <!-- Transaction Form -->
    <section class="transaction-form">
      <form id="transaction-form">
        <label for="description">Description</label>
        <input type="text" id="description" required placeholder="e.g., Salary, Groceries" />
        <small id="desc-error" class="error-message" style="color: red; display: none;">Description cannot contain numbers!</small>

        <label for="amount">Amount</label>
        <input type="number" id="amount" required placeholder="Enter amount" step="0.01" />

        <label for="type">Type</label>
        <select id="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List -->
    <section class="transactions">
      <h2>Transactions <button id="view-all-btn">View All</button></h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
